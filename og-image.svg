<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#05045F"/>
            <stop offset="100%" stop-color="#0a0a7a"/>
        </linearGradient>
        <radialGradient id="gold" cx="0.85" cy="0.15" r="0.5">
            <stop offset="0%" stop-color="#F5B800" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#F5B800" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="blue" cx="0.1" cy="0.95" r="0.5">
            <stop offset="0%" stop-color="#2D6BFF" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#2D6BFF" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M60 0 H0 V60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <rect width="1200" height="630" fill="url(#gold)"/>
    <rect width="1200" height="630" fill="url(#blue)"/>

    <!-- Decorative dots -->
    <circle cx="100" cy="120" r="4" fill="#F5B800" opacity="0.8"/>
    <circle cx="1080" cy="180" r="5" fill="#F5B800" opacity="0.6"/>
    <circle cx="80" cy="510" r="4" fill="#2D6BFF" opacity="0.7"/>
    <circle cx="1110" cy="490" r="3" fill="#F5B800" opacity="0.7"/>

    <!-- Decorative rings -->
    <circle cx="1180" cy="60" r="180" fill="none" stroke="#F5B800" stroke-width="1" opacity="0.18"/>
    <circle cx="20" cy="600" r="140" fill="none" stroke="#2D6BFF" stroke-width="1" opacity="0.18"/>

    <!-- Logo mark (square + dot) -->
    <g transform="translate(80, 80)">
        <rect width="64" height="64" rx="14" fill="#0a0a7a"/>
        <circle cx="32" cy="32" r="10" fill="#F5B800"/>
    </g>
    <text x="170" y="125" fill="#FFFFFF" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="36">Datalio</text>

    <!-- Main title -->
    <text x="80" y="280" fill="#FFFFFF" font-family="Poppins,Arial,sans-serif" font-weight="800" font-size="72">Solutions digitales</text>
    <text x="80" y="370" fill="#FFFFFF" font-family="Poppins,Arial,sans-serif" font-weight="800" font-size="72">pour <tspan fill="#F5B800">entreprises</tspan></text>

    <!-- Tagline -->
    <text x="80" y="445" fill="rgba(255,255,255,0.85)" font-family="Poppins,Arial,sans-serif" font-weight="500" font-size="28">Gérez mieux. Automatisez plus. Avancez vite.</text>

    <!-- Services strip -->
    <g transform="translate(80, 520)">
        <text x="0" y="0" fill="#F5B800" font-family="Poppins,Arial,sans-serif" font-weight="600" font-size="22" letter-spacing="2">GESTION  ·  AUTOMATISATION  ·  CHATBOTS  ·  SUIVI CLIENT</text>
    </g>

    <!-- Bottom-right pill -->
    <g transform="translate(950, 545)">
        <rect width="200" height="44" rx="22" fill="rgba(245,184,0,0.18)" stroke="#F5B800" stroke-width="1" stroke-opacity="0.4"/>
        <text x="100" y="29" fill="#F5B800" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="16" text-anchor="middle">datalio.com</text>
    </g>
</svg>
